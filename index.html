<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家計簿</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2563eb;
      --text: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
      -webkit-tap-highlight-color: transparent;
    }
    
    header {
      background: var(--card);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      text-align: center;
    }
    header h1 { font-size: 1.1rem; color: #1e293b; }

    .container { max-width: 760px; margin: 0 auto; padding: 16px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    
    /* カードヘッダー（月選択ドロップダウン用） */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 8px;
    }
    .card-header h2 {
      font-size: 1.1rem;
      margin-bottom: 0;
      border-bottom: none;
      padding-bottom: 0;
      color: #1e293b;
    }
    .month-select {
      width: auto;
      padding: 6px 10px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-weight: bold;
      color: #334155;
      cursor: pointer;
      outline: none;
    }
    .month-select:focus { border-color: var(--primary); }

    /* フォーム関連 */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
    input, select, button {
      width: 100%; padding: 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.95rem; background: #fff;
    }
    .form-row { display: flex; gap: 8px; }
    .form-row > div { flex: 1; }

    .guide-box {
      background: #eff6ff; border-left: 4px solid var(--primary); padding: 8px 12px;
      font-size: 0.75rem; color: #1e40af; margin-bottom: 12px; border-radius: 0 6px 6px 0; line-height: 1.4;
    }

    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
    .btn-green { background: #10b981; }
    .btn-red { background: #ef4444; }

    /* カレンダー */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-header h3 { font-size: 1.1rem; }
    .calendar-header button { width: auto; padding: 6px 16px; font-size: 0.85rem; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: var(--border); border-radius: 8px; overflow: hidden; }
    .calendar-day-head { background: #f1f5f9; text-align: center; padding: 6px 0; font-size: 0.75rem; font-weight: bold; color: var(--text-sub); }
    .calendar-cell { background: #fff; min-height: 52px; padding: 4px 2px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; position: relative; }
    .calendar-cell.other-month { background: #fafafa; opacity: 0.4; }
    .calendar-cell.selected { background: #eff6ff; outline: 2px solid var(--primary); z-index: 1; }
    .day-num { font-size: 0.75rem; font-weight: bold; color: var(--text); }
    .day-badge { font-size: 0.58rem; line-height: 1.1; text-align: right; padding-right: 2px; white-space: nowrap; }
    .badge-exp { color: #ef4444; }
    .badge-rev { color: #10b981; }

    /* 取引リスト */
    .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .tx-item:last-child { border-bottom: none; }
    .tx-info { flex: 1; }
    .tx-title { font-size: 0.9rem; font-weight: bold; }
    .tx-sub { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
    .tx-amount { text-align: right; font-weight: bold; font-size: 0.95rem; margin-right: 12px; }
    .tx-btns { display: flex; gap: 4px; }
    .btn-edit-sm { background: #3b82f6; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; width: auto; }
    .btn-del-sm { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; width: auto; }

    /* P/L テーブルスタイル */
    .table-responsive { overflow-x: auto; }
    .pl-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .pl-table th, .pl-table td { border-bottom: 1px solid var(--border); padding: 10px 8px; text-align: left; }
    .pl-table th { color: var(--text-sub); font-size: 0.75rem; font-weight: normal; }
    .pl-section-title { font-weight: bold; color: var(--text-sub); font-size: 0.8rem; background: #f8fafc; }
    .amount { text-align: right; white-space: nowrap; }
    .bg-green-light { background: #f0fdf4 !important; font-weight: bold; }
    .bg-red-light { background: #fef2f2 !important; font-weight: bold; }
    .bg-cyan-light { background: #e6fffa !important; font-weight: bold; }

    /* B/S テーブルスタイル */
    .bs-t-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
    .bs-t-box { flex: 1; min-width: 270px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
    .bs-t-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .bs-t-table th { background: #fef08a; color: #1e293b; text-align: center; padding: 10px 8px; font-size: 0.9rem; border-bottom: 2px solid var(--border); }
    .bs-t-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
    .bs-sub-header { background: #f8fafc; font-weight: bold; color: var(--text-sub); font-size: 0.8rem; }
    .bs-total-row { background: #fef08a; font-weight: bold; color: #1e293b; }

    /* グラフコンテナ */
    .chart-container { position: relative; margin-top: 12px; width: 100%; height: 250px; }
    .pie-chart-container { position: relative; margin: 0 auto; width: 100%; max-width: 400px; height: 320px; }
    .pie-center-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
    .pie-center-title { font-size: 0.85rem; color: var(--text-sub); font-weight: bold; }
    .pie-center-amount { font-size: 1.3rem; font-weight: bold; color: var(--text); margin-top: 2px; }

    /* 下部ナビゲーション */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-item {
      flex: 1; text-align: center; padding: 8px 0; color: var(--text-sub);
      font-size: 0.75rem; cursor: pointer; text-decoration: none;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-icon { font-size: 1.2rem; }

    .loading-banner { background: #fef3c7; color: #92400e; text-align: center; padding: 6px; font-size: 0.8rem; display: none; }
  </style>
</head>
<body>

<header>
  <h1>🔒 家計簿</h1>
</header>
<div id="loadingBanner" class="loading-banner">🔄 スプレッドシートからデータを同期中...</div>

<div class="container">

  <!-- ================= タブ①：入力フォーム ================= -->
  <div id="tab-input" class="tab-content">
    <div class="card">
      <div class="card-header">
        <h2 id="formTitle">取引の入力</h2>
      </div>
      <div class="guide-box">
        💡 <b>簡単えらび方ガイド</b><br>
        ・<b>買い物・支払いのとき：</b> 左に使った費目、右に払った口座やカード<br>
        ・<b>給料・収入のとき：</b> 左に入金先の口座、右に収入の項目<br>
        ・<b>投資信託の月末調整：</b> 増えたら左に投信・右に運用益、減ったら左に運用損・右に投信
      </div>
      <form id="txForm">
        <input type="hidden" id="editId" value="">
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label>摘要（メモ）</label>
          <input type="text" id="desc" placeholder="例: 月末評価額調整、スーパーで食材購入" required>
        </div>
        <div class="form-row form-group">
          <div>
            <label>使い道・増えたもの</label>
            <select id="debitAcc"></select>
          </div>
          <div>
            <label>支払い元・収入源</label>
            <select id="creditAcc"></select>
          </div>
        </div>
        <div class="form-group">
          <label>金額 (円)</label>
          <input type="number" id="amount" min="1" placeholder="3000" inputmode="numeric" required>
        </div>
        <button type="submit" id="submitBtn">登録する</button>
        <button type="button" id="cancelEditBtn" style="display:none; background:#64748b; margin-top:8px;">編集をキャンセル</button>
      </form>
    </div>
  </div>

  <!-- ================= タブ②：カレンダー ================= -->
  <div id="tab-calendar" class="tab-content active">
    <div class="card">
      <div class="calendar-header">
        <button onclick="changeMonth(-1)">◀ 前月</button>
        <h3 id="calendarTitle"></h3>
        <button onclick="changeMonth(1)">次月 ▶</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 id="selectedDateTitle">取引一覧</h2>
      </div>
      <div id="dailyTxList"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>データ同期・設定</h2>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button id="syncBtn" style="background:#0284c7;">スプレッドシートから全読み込み</button>
        <button id="backupBtn" class="btn-green">未送信の差分のみ追記保存</button>
        <button id="clearBtn" class="btn-red">全データを初期化（エラー解消用）</button>
      </div>
    </div>
  </div>

  <!-- ================= タブ③：損益計算書 (P/L) ================= -->
  <div id="tab-pl" class="tab-content">
    
    <!-- 1. 月間推移グラフ -->
    <div class="card">
      <div class="card-header">
        <h2>月間推移（収入・支出・手残り）</h2>
      </div>
      <div class="chart-container">
        <canvas id="plTrendChart"></canvas>
      </div>
    </div>
    
    <!-- 2. 支出の内訳（円グラフ） 月選択付き -->
    <div class="card">
      <div class="card-header">
        <h2>支出の内訳（円グラフ）</h2>
        <select id="pieMonthSelect" class="month-select"></select>
      </div>
      <div class="pie-chart-container">
        <div class="pie-center-text">
          <div class="pie-center-title">支出合計</div>
          <div class="pie-center-amount" id="pieCenterAmount">0円</div>
        </div>
        <canvas id="plPieChart"></canvas>
      </div>
    </div>

    <!-- 3. 損益計算書 (P/L) 月選択付き -->
    <div class="card">
      <div class="card-header">
        <h2>損益計算書 (P/L)</h2>
        <select id="plTableMonthSelect" class="month-select"></select>
      </div>
      <div class="table-responsive">
        <table class="pl-table">
          <thead><tr><th>科目</th><th class="amount">金額</th></tr></thead>
          <tbody id="plBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ================= タブ④：貸借対照表 (B/S) ================= -->
  <div id="tab-bs" class="tab-content">
    
    <!-- 1. 月間推移グラフ -->
    <div class="card">
      <div class="card-header">
        <h2>純資産・資産・負債の月間推移</h2>
      </div>
      <div class="chart-container">
        <canvas id="bsTrendChart"></canvas>
      </div>
    </div>

    <!-- 2. 貸借対照表 (B/S) 月選択付き -->
    <div class="card">
      <div class="card-header">
        <h2>貸借対照表 (B/S)</h2>
        <select id="bsTableMonthSelect" class="month-select"></select>
      </div>
      <div id="bsBody"></div>
    </div>
  </div>

</div>

<!-- 下部ナビゲーションバー -->
<nav class="bottom-nav">
  <div class="nav-item" onclick="switchTab('input', this)">
    <span class="nav-icon">✏️</span>入力
  </div>
  <div class="nav-item active" onclick="switchTab('calendar', this)">
    <span class="nav-icon">📅</span>カレンダー
  </div>
  <div class="nav-item" onclick="switchTab('pl', this)">
    <span class="nav-icon">📈</span>P/L
  </div>
  <div class="nav-item" onclick="switchTab('bs', this)">
    <span class="nav-icon">⚖️</span>B/S
  </div>
</nav>

<script>
  // GASのデプロイURLを設定（空の場合はローカル保存のみ）
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwJSx6QgfSISA5iwqbaSj6GDxSdXLD88M1ud-SKakQLlma-_Yi0VeUv1FGTgyB6TcrG/exec";

  // 科目マスタ
  const ACCOUNTS = [
    { id: 'cash', name: '現金・口座', type: 'asset', category: 'asset' },
    { id: 'paypay', name: '電子マネー', type: 'asset', category: 'asset' },
    { id: 'investment', name: '投資信託・有価証券', type: 'asset', category: 'asset' },
    
    { id: 'card', name: 'カード未払金', type: 'liability', category: 'liability' },
    
    { id: 'equity', name: '過去の蓄積（繰越金）', type: 'equity', category: 'equity' },
    
    { id: 'salary', name: '給料収入', type: 'revenue', category: 'revenue' },
    { id: 'other_rev', name: 'その他収入', type: 'revenue', category: 'revenue' },
  
    { id: 'rent', name: '住居費・家賃', type: 'expense', category: 'fixed' },
    { id: 'utility', name: '光熱水道費', type: 'expense', category: 'fixed' },
    { id: 'telecom', name: '通信費（携帯・ネット）', type: 'expense', category: 'fixed' },
    { id: 'subscription', name: 'サブスク・定額費', type: 'expense', category: 'fixed' },
    { id: 'insurance', name: '保険料（生命保険、車両保険等）', type: 'expense', category: 'fixed' },

    { id: 'food_grocery', name: '食料品費', type: 'expense', category: 'variable' },
    { id: 'food_out', name: '外食代', type: 'expense', category: 'variable' },
    { id: 'med_treatment', name: '治療費・診察代', type: 'expense', category: 'variable' },
    { id: 'daily', name: '日用品費', type: 'expense', category: 'variable' },
    { id: 'beauty', name: '美容費', type: 'expense', category: 'variable' },
    { id: 'car', name: '自動車費（ガソリン等）', type: 'expense', category: 'variable' },
    { id: 'education', name: '教養・勉強費', type: 'expense', category: 'variable' },
    { id: 'hobby', name: '娯楽・趣味費', type: 'expense', category: 'variable' },
    { id: 'other_exp', name: '雑費・その他支出', type: 'expense', category: 'variable' }
  ];

  let transactions = [];
  let chartPLTrend = null, chartPLPie = null, chartBSTrend = null;
  let currentCalDate = new Date();
  let selectedDateStr = new Date().toISOString().split('T')[0];

  // ドロップダウンで選択中の月 (YYYY-MM形式)
  let currentPieMonth = "";
  let currentPLMonth = "";
  let currentBSMonth = "";

  function cleanDateStr(dStr) {
    if (!dStr) return '';
    let str = String(dStr).trim();
    if (str.includes('T')) {
      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      str = str.split('T')[0];
    }
    return str;
  }

  function getUniqueMonths() {
    const sorted = [...transactions].sort((a, b) => cleanDateStr(a.date).localeCompare(cleanDateStr(b.date)));
    const mSet = new Set(sorted.map(t => cleanDateStr(t.date).substring(0, 7)).filter(d => d));
    return Array.from(mSet);
  }

  function loadLocalData() {
    try {
      const stored = localStorage.getItem('kakeibo_txs');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) {
          transactions = parsed.map(t => ({
            ...t,
            date: cleanDateStr(t.date),
            amount: Number(t.amount) || 0,
            synced: t.synced === true
          }));
        }
      }
    } catch (e) { transactions = []; }
  }

  function setupAccountSelects() {
    const debitSelect = document.getElementById('debitAcc');
    const creditSelect = document.getElementById('creditAcc');
    if (!debitSelect || !creditSelect) return;
    
    debitSelect.innerHTML = '';
    creditSelect.innerHTML = '';

    const debitGroups = [
      { label: '💰 変動費（使った目的）', category: 'variable' },
      { label: '📌 固定費（使った目的）', category: 'fixed' },
      { label: '🏦 資産（財布・口座・投信）', category: 'asset' },
      { label: '💳 負債（あとで払うお金）', category: 'liability' },
      { label: '🏛️ 繰越資金', category: 'equity' }
    ];
    const creditGroups = [
      { label: '🏦 資産（財布・口座・投信）', category: 'asset' },
      { label: '💳 負債（あとで払うお金）', category: 'liability' },
      { label: '💵 収入（お金の発生源）', category: 'revenue' },
      { label: '🏛️ 繰越資金', category: 'equity' }
    ];

    debitGroups.forEach(g => {
      const accs = ACCOUNTS.filter(a => a.category === g.category);
      if (accs.length === 0) return;
      const optgroup = document.createElement('optgroup');
      optgroup.label = g.label;
      accs.forEach(acc => optgroup.appendChild(new Option(acc.name, acc.id)));
      debitSelect.appendChild(optgroup);
    });

    creditGroups.forEach(g => {
      const accs = ACCOUNTS.filter(a => a.category === g.category);
      if (accs.length === 0) return;
      const optgroup = document.createElement('optgroup');
      optgroup.label = g.label;
      accs.forEach(acc => optgroup.appendChild(new Option(acc.name, acc.id)));
      creditSelect.appendChild(optgroup);
    });

    debitSelect.value = 'food_grocery';
    creditSelect.value = 'cash';
  }

  function switchTab(tabName, el) {
    document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    document.getElementById(`tab-${tabName}`).classList.add('active');
    if (el) el.classList.add('active');
    renderAll();
  }

  // ================= イベントリスナー：フォーム関連 =================
  const txForm = document.getElementById('txForm');
  if (txForm) {
    txForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const txData = {
        date: cleanDateStr(document.getElementById('date').value),
        desc: document.getElementById('desc').value,
        debit: document.getElementById('debitAcc').value,
        credit: document.getElementById('creditAcc').value,
        amount: Number(document.getElementById('amount').value),
        synced: false
      };

      if (editId) {
        const index = transactions.findIndex(t => t.id === Number(editId));
        if (index !== -1) {
          transactions[index] = { ...transactions[index], ...txData };
          alert("更新しました！");
        }
      } else {
        transactions.push({ id: Date.now(), ...txData });
        alert("登録しました！");
      }

      selectedDateStr = txData.date;
      localStorage.setItem('kakeibo_txs', JSON.stringify(transactions));
      resetForm();
      renderAll();
      switchTab('calendar', document.querySelectorAll('.nav-item')[1]);
    });
  }

  function editTx(id) {
    const tx = transactions.find(t => t.id === id);
    if (!tx) return;
    document.getElementById('editId').value = tx.id;
    document.getElementById('date').value = tx.date;
    document.getElementById('desc').value = tx.desc;
    document.getElementById('debitAcc').value = tx.debit;
    document.getElementById('creditAcc').value = tx.credit;
    document.getElementById('amount').value = tx.amount;
    document.getElementById('formTitle').textContent = "取引の編集";
    document.getElementById('submitBtn').textContent = "更新する";
    document.getElementById('cancelEditBtn').style.display = "block";
    switchTab('input', document.querySelectorAll('.nav-item')[0]);
  }

  function resetForm() {
    document.getElementById('editId').value = '';
    document.getElementById('date').value = selectedDateStr;
    document.getElementById('desc').value = '';
    document.getElementById('debitAcc').value = 'food_grocery';
    document.getElementById('creditAcc').value = 'cash';
    document.getElementById('amount').value = '';
    document.getElementById('formTitle').textContent = "取引の入力";
    document.getElementById('submitBtn').textContent = "登録する";
    document.getElementById('cancelEditBtn').style.display = "none";
  }

  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if (cancelEditBtn) cancelEditBtn.addEventListener('click', resetForm);

  function deleteTx(id) {
    if (confirm("この取引を削除しますか？")) {
      transactions = transactions.filter(tx => tx.id !== id);
      localStorage.setItem('kakeibo_txs', JSON.stringify(transactions));
      renderAll();
    }
  }

  // ================= イベントリスナー：同期・保存 =================
  async function loadFromSpreadsheet() {
    if (GAS_URL.includes("YOUR_DEPLOYED_SCRIPT_ID")) { renderAll(); return; }
    const banner = document.getElementById('loadingBanner');
    if(banner) banner.style.display = 'block';

    try {
      const res = await fetch(GAS_URL);
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        transactions = data.map(t => ({
          ...t,
          date: cleanDateStr(t.date),
          amount: Number(t.amount) || 0,
          synced: true
        }));
        localStorage.setItem('kakeibo_txs', JSON.stringify(transactions));
      }
    } catch (err) { console.log("同期エラー", err); } 
    finally { if(banner) banner.style.display = 'none'; renderAll(); }
  }

  document.getElementById('syncBtn')?.addEventListener('click', loadFromSpreadsheet);

  // 【分割送信機能】
  const backupBtn = document.getElementById('backupBtn');
  if (backupBtn) {
    backupBtn.addEventListener('click', async () => {
      if (GAS_URL.includes("YOUR_DEPLOYED_SCRIPT_ID")) { alert("GAS_URLを設定してください。"); return; }
      const unsyncedTxs = transactions.filter(t => !t.synced);
      if (unsyncedTxs.length === 0) { alert("新しいデータはありません。"); return; }

      backupBtn.disabled = true;
      const CHUNK_SIZE = 10;
      let successCount = 0;
      let hasError = false;

      for (let i = 0; i < unsyncedTxs.length; i += CHUNK_SIZE) {
        const chunk = unsyncedTxs.slice(i, i + CHUNK_SIZE);
        const currentEnd = Math.min(i + CHUNK_SIZE, unsyncedTxs.length);
        backupBtn.textContent = `送信中... (${i + 1} 〜 ${currentEnd} / ${unsyncedTxs.length}件)`;

        try {
          await fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ transactions: chunk })
          });
          chunk.forEach(t => { const target = transactions.find(tx => tx.id === t.id); if(target) target.synced = true; });
          localStorage.setItem('kakeibo_txs', JSON.stringify(transactions));
          successCount += chunk.length;
          await new Promise(resolve => setTimeout(resolve, 500)); // 負荷軽減
        } catch (err) { hasError = true; break; }
      }

      if (hasError) alert(`エラー発生。\n${successCount}件まで保存されました。`);
      else alert(`${successCount}件を追記保存しました！`);
      
      backupBtn.disabled = false;
      backupBtn.textContent = "未送信の差分のみ追記保存";
      renderAll();
    });
  }

  document.getElementById('clearBtn')?.addEventListener('click', () => {
    if (confirm('【注意】全データを削除しますか？')) {
      transactions = [];
      localStorage.removeItem('kakeibo_txs');
      renderAll();
    }
  });

  // ================= レンダリング（カレンダー） =================
  function changeMonth(diff) {
    currentCalDate.setMonth(currentCalDate.getMonth() + diff);
    renderCalendar();
  }

  function selectDate(dateStr) {
    selectedDateStr = dateStr;
    const dateInput = document.getElementById('date');
    if (dateInput) dateInput.value = selectedDateStr;
    renderCalendar();
    renderDailyList();
  }

  function renderCalendar() {
    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    const title = document.getElementById('calendarTitle');
    if (title) title.textContent = `${year}年 ${month + 1}月`;

    const grid = document.getElementById('calendarGrid');
    if (!grid) return;
    grid.innerHTML = '';

    const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
    weekDays.forEach(d => {
      const head = document.createElement('div');
      head.className = 'calendar-day-head'; head.textContent = d; grid.appendChild(head);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    for (let i = firstDay - 1; i >= 0; i--) {
      const cell = document.createElement('div');
      cell.className = 'calendar-cell other-month'; cell.innerHTML = `<span class="day-num">${prevLastDate - i}</span>`;
      grid.appendChild(cell);
    }

    for (let d = 1; d <= lastDate; d++) {
      const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = `calendar-cell ${dStr === selectedDateStr ? 'selected' : ''}`;
      cell.onclick = () => selectDate(dStr);

      let dayExp = 0, dayRev = 0;
      transactions.filter(t => cleanDateStr(t.date) === dStr).forEach(t => {
        const deb = ACCOUNTS.find(a => a.id === t.debit);
        const cred = ACCOUNTS.find(a => a.id === t.credit);
        if (deb?.type === 'expense') dayExp += t.amount;
        if (cred?.type === 'revenue') dayRev += t.amount;
      });

      let badgeHtml = '';
      if (dayRev > 0) badgeHtml += `<div class="day-badge badge-rev">+${dayRev.toLocaleString()}</div>`;
      if (dayExp > 0) badgeHtml += `<div class="day-badge badge-exp">-${dayExp.toLocaleString()}</div>`;

      cell.innerHTML = `<span class="day-num">${d}</span><div>${badgeHtml}</div>`;
      grid.appendChild(cell);
    }
    renderDailyList();
  }

  function renderDailyList() {
    const titleEl = document.getElementById('selectedDateTitle');
    if (titleEl) titleEl.textContent = `取引一覧 (${selectedDateStr})`;
    const container = document.getElementById('dailyTxList');
    if (!container) return;

    const dayTxs = transactions.filter(t => cleanDateStr(t.date) === selectedDateStr);
    if (dayTxs.length === 0) {
      container.innerHTML = `<div style="font-size:0.85rem; color:var(--text-sub); padding:12px 0;">この日の取引はありません</div>`;
      return;
    }

    let html = '';
    dayTxs.forEach(tx => {
      const deb = ACCOUNTS.find(a => a.id === tx.debit)?.name || tx.debit;
      const cred = ACCOUNTS.find(a => a.id === tx.credit)?.name || tx.credit;
      html += `
        <div class="tx-item">
          <div class="tx-info">
            <div class="tx-title">${tx.desc}</div><div class="tx-sub">${deb} ← ${cred}</div>
          </div>
          <div class="tx-amount">${tx.amount.toLocaleString()}円</div>
          <div class="tx-btns">
            <button class="btn-edit-sm" onclick="editTx(${tx.id})">編集</button>
            <button class="btn-del-sm" onclick="deleteTx(${tx.id})">削除</button>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  // ================= セレクトボックス更新 =================
  function updateMonthSelects() {
    const months = getUniqueMonths();
    if (months.length === 0) return;

    const latest = months[months.length - 1];
    if (!currentPieMonth || !months.includes(currentPieMonth)) currentPieMonth = latest;
    if (!currentPLMonth || !months.includes(currentPLMonth)) currentPLMonth = latest;
    if (!currentBSMonth || !months.includes(currentBSMonth)) currentBSMonth = latest;

    const optionsHtml = months.map(m => `<option value="${m}">${m.replace('-', '年')}月</option>`).join('');

    ['pieMonthSelect', 'plTableMonthSelect', 'bsTableMonthSelect'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.innerHTML = optionsHtml;
        if (id === 'pieMonthSelect') el.value = currentPieMonth;
        if (id === 'plTableMonthSelect') el.value = currentPLMonth;
        if (id === 'bsTableMonthSelect') el.value = currentBSMonth;
      }
    });
  }

  ['pieMonthSelect', 'plTableMonthSelect', 'bsTableMonthSelect'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', (e) => {
      if (id === 'pieMonthSelect') { currentPieMonth = e.target.value; renderPieChart(); }
      if (id === 'plTableMonthSelect') { currentPLMonth = e.target.value; renderPLTable(); }
      if (id === 'bsTableMonthSelect') { currentBSMonth = e.target.value; renderBSTable(); }
    });
  });

  // ================= レンダリング（P/L テーブル：月別） =================
  function renderPLTable() {
    const plBody = document.getElementById('plBody');
    if (!plBody) return;

    // 選択された月の取引だけを抽出
    const mTxs = transactions.filter(t => cleanDateStr(t.date).startsWith(currentPLMonth));
    const balances = {};
    ACCOUNTS.forEach(a => balances[a.id] = 0);
    
    mTxs.forEach(tx => {
      if (balances[tx.debit] !== undefined) balances[tx.debit] += tx.amount;
      if (balances[tx.credit] !== undefined) balances[tx.credit] -= tx.amount;
    });

    let totalRev = 0, totalFixed = 0, totalVar = 0, html = '';

    // 収入
    html += `<tr><td colspan="2" class="pl-section-title">［収入の部］</td></tr>`;
    ACCOUNTS.filter(a => a.category === 'revenue').forEach(a => {
      const val = -balances[a.id]; totalRev += val;
      html += `<tr><td>${a.name}</td><td class="amount">${val.toLocaleString()}円</td></tr>`;
    });
    html += `<tr class="bg-green-light pl-total-row"><td>収入合計</td><td class="amount">${totalRev.toLocaleString()}円</td></tr>`;

    // 固定費
    html += `<tr><td colspan="2" class="pl-section-title">［固定費］</td></tr>`;
    ACCOUNTS.filter(a => a.category === 'fixed').forEach(a => {
      const val = balances[a.id]; totalFixed += val;
      html += `<tr><td>${a.name}</td><td class="amount">${val.toLocaleString()}円</td></tr>`;
    });

    // 変動費
    html += `<tr><td colspan="2" class="pl-section-title">［変動費］</td></tr>`;
    ACCOUNTS.filter(a => a.category === 'variable').forEach(a => {
      const val = balances[a.id]; totalVar += val;
      html += `<tr><td>${a.name}</td><td class="amount">${val.toLocaleString()}円</td></tr>`;
    });

    const totalExp = totalFixed + totalVar;
    const netSavings = totalRev - totalExp;

    html += `<tr class="bg-red-light pl-total-row"><td>支出合計</td><td class="amount">${totalExp.toLocaleString()}円</td></tr>`;
    html += `<tr class="bg-cyan-light pl-total-row"><td>今期の収支差額</td><td class="amount">${netSavings.toLocaleString()}円</td></tr>`;

    plBody.innerHTML = html;
  }

  // ================= レンダリング（B/S テーブル：選択月末までの累計） =================
  function renderBSTable() {
    const bsBody = document.getElementById('bsBody');
    if (!bsBody) return;

    // 選択された月までの全取引を抽出（特定時点の残高スナップショット）
    const endOfMonthStr = `${currentBSMonth}-31`;
    const snapshotTxs = transactions.filter(t => cleanDateStr(t.date) <= endOfMonthStr);

    const balances = {};
    ACCOUNTS.forEach(a => balances[a.id] = 0);
    snapshotTxs.forEach(tx => {
      if (balances[tx.debit] !== undefined) balances[tx.debit] += tx.amount;
      if (balances[tx.credit] !== undefined) balances[tx.credit] -= tx.amount;
    });

    let totalAst = 0, totalLia = 0, totalRev = 0, totalExp = 0;

    let astRows = '';
    ACCOUNTS.filter(a => a.type === 'asset').forEach(a => {
      const val = balances[a.id]; totalAst += val;
      astRows += `<tr><td>${a.name}</td><td class="amount">${val.toLocaleString()}円</td></tr>`;
    });

    let liaEqRows = `<tr class="bs-sub-header"><td colspan="2">［負債の部］</td></tr>`;
    ACCOUNTS.filter(a => a.type === 'liability').forEach(a => {
      const val = -balances[a.id]; totalLia += val;
      liaEqRows += `<tr><td>${a.name}</td><td class="amount">${val.toLocaleString()}円</td></tr>`;
    });

    ACCOUNTS.filter(a => a.type === 'expense').forEach(a => totalExp += balances[a.id]);
    ACCOUNTS.filter(a => a.type === 'revenue').forEach(a => totalRev += -balances[a.id]);
    
    const baseEquity = balances['equity'] ? -balances['equity'] : 0;
    const netIncome = totalRev - totalExp;

    liaEqRows += `<tr class="bs-sub-header"><td colspan="2">［純資産の部］</td></tr>`;
    liaEqRows += `<tr><td>過去の蓄積（繰越金）</td><td class="amount">${baseEquity.toLocaleString()}円</td></tr>`;
    liaEqRows += `<tr><td>今期の収支差額</td><td class="amount">${netIncome.toLocaleString()}円</td></tr>`;

    const totalLiaEq = totalLia + baseEquity + netIncome;

    bsBody.innerHTML = `
      <div class="bs-t-container">
        <div class="bs-t-box">
          <table class="bs-t-table">
            <thead><tr><th>資産</th><th class="amount">金額</th></tr></thead>
            <tbody>
              ${astRows}
              <tr class="bs-total-row"><td>資産合計</td><td class="amount">${totalAst.toLocaleString()}円</td></tr>
            </tbody>
          </table>
        </div>
        <div class="bs-t-box">
          <table class="bs-t-table">
            <thead><tr><th>負債・純資産</th><th class="amount">金額</th></tr></thead>
            <tbody>
              ${liaEqRows}
              <tr class="bs-total-row"><td>負債・純資産合計</td><td class="amount">${totalLiaEq.toLocaleString()}円</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // ================= レンダリング（グラフ全般） =================
  function renderCharts() {
    renderTrendCharts();
    renderPieChart();
  }

  function renderTrendCharts() {
    if (typeof Chart === 'undefined') return;
    const months = getUniqueMonths();
    if (months.length === 0) return;

    const plRev = [], plExp = [], plNet = [], bsAst = [], bsLia = [], bsEq = [];
    const runBal = {}; ACCOUNTS.forEach(a => runBal[a.id] = 0);

    months.forEach(m => {
      let mRev = 0, mExp = 0;
      transactions.filter(t => cleanDateStr(t.date).startsWith(m)).forEach(tx => {
        if (runBal[tx.debit] !== undefined) runBal[tx.debit] += tx.amount;
        if (runBal[tx.credit] !== undefined) runBal[tx.credit] -= tx.amount;
        const debT = ACCOUNTS.find(a => a.id === tx.debit)?.type;
        const credT = ACCOUNTS.find(a => a.id === tx.credit)?.type;
        if (debT === 'expense') mExp += tx.amount;
        if (credT === 'revenue') mRev += tx.amount;
      });
      plRev.push(mRev); plExp.push(mExp); plNet.push(mRev - mExp);

      let ast = 0, lia = 0;
      ACCOUNTS.filter(a => a.type === 'asset').forEach(a => ast += runBal[a.id]);
      ACCOUNTS.filter(a => a.type === 'liability').forEach(a => lia += -runBal[a.id]);
      bsAst.push(ast); bsLia.push(lia); bsEq.push(ast - lia);
    });

    const plTrendCanvas = document.getElementById('plTrendChart');
    if (plTrendCanvas) {
      if (chartPLTrend) chartPLTrend.destroy();
      chartPLTrend = new Chart(plTrendCanvas, {
        type: 'line',
        data: { labels: months, datasets: [
          { label: '収入', data: plRev, borderColor: '#10b981', tension: 0.2 },
          { label: '支出', data: plExp, borderColor: '#ef4444', tension: 0.2 },
          { label: '手残り', data: plNet, borderColor: '#2563eb', tension: 0.2 }
        ]},
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    const bsTrendCanvas = document.getElementById('bsTrendChart');
    if (bsTrendCanvas) {
      if (chartBSTrend) chartBSTrend.destroy();
      chartBSTrend = new Chart(bsTrendCanvas, {
        type: 'line',
        data: { labels: months, datasets: [
          { label: '純資産（蓄積）', data: bsEq, borderColor: '#2563eb', tension: 0.2, borderWidth: 3 },
          { label: '総資産', data: bsAst, borderColor: '#10b981', tension: 0.2 },
          { label: '負債', data: bsLia, borderColor: '#ef4444', tension: 0.2 }
        ]},
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
  }

  function renderPieChart() {
    if (typeof Chart === 'undefined') return;
    const monthExpBalances = {};
    ACCOUNTS.filter(a => a.type === 'expense').forEach(a => monthExpBalances[a.id] = 0);

    transactions.filter(t => cleanDateStr(t.date).startsWith(currentPieMonth)).forEach(tx => {
      if (monthExpBalances[tx.debit] !== undefined) monthExpBalances[tx.debit] += tx.amount;
    });

    const expAccounts = ACCOUNTS.filter(a => a.type === 'expense' && monthExpBalances[a.id] > 0);
    const pieLabels = expAccounts.map(a => a.name);
    const pieData = expAccounts.map(a => monthExpBalances[a.id]);
    const totalExpSum = pieData.reduce((sum, v) => sum + v, 0);

    const centerAmountEl = document.getElementById('pieCenterAmount');
    if (centerAmountEl) centerAmountEl.textContent = `${totalExpSum.toLocaleString()}円`;

    // 画像の色味に合わせたカラーパレット
    const colors = ['#ef4444', '#f97316', '#84cc16', '#10b981', '#06b6d4', '#6366f1', '#8b5cf6', '#ec4899', '#a855f7', '#eab308'];

    const plPieCanvas = document.getElementById('plPieChart');
    if (plPieCanvas) {
      if (chartPLPie) chartPLPie.destroy();
      const pluginsConfig = (typeof ChartDataLabels !== 'undefined') ? [ChartDataLabels] : [];

      chartPLPie = new Chart(plPieCanvas, {
        type: 'doughnut',
        plugins: pluginsConfig,
        data: {
          labels: pieLabels,
          datasets: [{ data: pieData, backgroundColor: colors, borderWidth: 2, borderColor: '#ffffff' }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '65%', layout: { padding: 45 },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(ctx) {
                  const val = ctx.raw || 0;
                  const pct = totalExpSum > 0 ? ((val / totalExpSum) * 100).toFixed(1) : 0;
                  return `${ctx.label}: ${val.toLocaleString()}円 (${pct}%)`;
                }
              }
            },
            datalabels: {
              anchor: 'end', align: 'end', offset: 5,
              color: function(ctx) { return colors[ctx.dataIndex % colors.length]; },
              font: { weight: 'bold', size: 10 },
              textAlign: 'center',
              formatter: function(value, ctx) {
                if (totalExpSum === 0) return '';
                const pct = Math.round((value / totalExpSum) * 100);
                if (pct < 2) return '';
                return `${ctx.chart.data.labels[ctx.dataIndex]}\n${pct}%`;
              }
            }
          }
        }
      });
    }
  }

  // ================= 統括レンダリング関数 =================
  function renderAll() {
    updateMonthSelects();
    renderCalendar();
    renderPLTable();
    renderBSTable();
    renderCharts();
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadLocalData();
    setupAccountSelects();
    resetForm();
    renderAll();
    loadFromSpreadsheet();
  });
</script>
</body>
</html>
